<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Oumaima Ameziane</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(212,83,126,0.5) transparent; }
      body { overflow-x: hidden; margin: 0; }
      #root { overflow-x: hidden; width: 100%; }
      /* Masquer toutes les scrollbars natives sauf html */
      body::-webkit-scrollbar, #root::-webkit-scrollbar { display: none; }
      body, #root { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
