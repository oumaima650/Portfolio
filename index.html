<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Oumaima Ameziane</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(212,83,126,0.5) transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        width: 100%;
        overflow-x: clip;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        width: 100%;
        overflow-x: clip;
      }
      /* Masquer toutes les scrollbars natives sauf html */
      body::-webkit-scrollbar, #root::-webkit-scrollbar { display: none; }
      body, #root { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
